#   ...or paste this file's content, below the --- line, into .github/workflows/ndk-toolchain-and-apk.yml
#   through the GitHub web UI ("Add file" -> "Create new file").
# Then run it from the Actions tab (Run workflow).
#
# What it does:
#   1. build-toolchain: runs tools/ndk-toolchain/build-llvm-android.sh (see that dir's README) -- cross-
#      compiles a clang+lld+llvm-binutils that RUN ON an Android arm64 device. This is the genuinely heavy,
#      uncertain part: multiple hours, ~13 GB free disk (a cleanup step is included; may still need a
#      bigger runner or a trimmed LLVM_TARGETS_TO_BUILD if it runs out of room or time). Manual trigger
#      only -- never on every push.
#   2. build-apk: needs the first job, points Gradle at its output (-Pndk.toolchain.dir=...), and runs
#      :ide-android:assembleDebug -- the SAME task the existing (untouched) apk.yml already runs on every
#      push, now with a real compiler for packToolchainAssets/jniLibs to find. One APK, no second app: the
#      NDK toolchain is a built-in now (NdkPlugin, app/ide-core), not samples/ndk-plugin's separate one.
#
# ---

name: NDK Toolchain + APK

on:
  workflow_dispatch:

env:
  JAVA_VERSION: "25"

jobs:
  build-toolchain:
    name: Build on-device LLVM toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build curl

      - name: Run build-llvm-android.sh
        working-directory: tools/ndk-toolchain
        run: |
          chmod +x build-llvm-android.sh
          ./build-llvm-android.sh

      - name: Upload toolchain output
        uses: actions/upload-artifact@v4
        with:
          name: ndk-toolchain-out
          path: tools/ndk-toolchain/build/out
          if-no-files-found: error
          retention-days: 90

  build-apk:
    name: assembleDebug (:ide-android, with real NDK toolchain)
    needs: build-toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download toolchain output
        uses: actions/download-artifact@v4
        with:
          name: ndk-toolchain-out
          path: tools/ndk-toolchain/build/out

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 platforms;android-36.1 build-tools;36.0.0"

      - name: Build debug APK (with real C/C++ compiler bundled)
        run: ./gradlew :ide-android:assembleDebug --console=plain --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codeassist-debug-apk-with-ndk
          path: app/ide-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

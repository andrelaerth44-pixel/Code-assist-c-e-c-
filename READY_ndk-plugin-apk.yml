# READY TO USE — this file is NOT active yet.
#
# The connected GitHub App lacks the `workflows` permission scope, so no session (this one included) can
# write straight into .github/workflows/. Moving it there is the one remaining manual step:
#
#   mkdir -p .github/workflows
#   git mv READY_ndk-plugin-apk.yml .github/workflows/ndk-toolchain-apk.yml
#   git commit -m "Enable NDK toolchain + main app build" && git push
#
# (or, from the GitHub web/mobile UI: open this file -> the "..." menu -> "Rename file" -> change the path
# to .github/workflows/ndk-toolchain-apk.yml -> commit directly to main.)
#
# UPDATED from the original version of this file: that one built `:samples:ndk-plugin:assembleDebug`, a
# SEPARATE installable plugin APK. C/C++ support is now built into the MAIN app instead (NdkPlugin is a
# built-in in app/ide-core, registered in BuiltInPlugins.kt, with usesHostNativeLibrary = true so it uses
# THIS app's own lib*.so — see app/ide-core/src/main/kotlin/dev/codeassist/ndk/NdkPlugin.kt and
# app/ide-android/build.gradle.kts's ndkToolchainLibs/packToolchainAssets). So this workflow now builds
# :ide-android:assembleDebug instead, the same target apk.yml already builds on every push — the only
# difference is THIS run also feeds it the LLVM toolchain, which apk.yml never builds (too slow to run on
# every push).
#
# What it does, in two jobs:
#   1. build-toolchain: runs tools/ndk-toolchain/build-llvm-android.sh, which cross-compiles a clang+lld+
#      llvm-binutils that RUN ON an Android arm64 device (see tools/ndk-toolchain/README.md for why this is
#      a build and not a download). This is the heavy, uncertain part: the script itself says it needs
#      cmake, ninja, curl, and ~13 GB free disk. A GitHub-hosted ubuntu-latest runner reports similar free
#      space but with real overhead already consumed, so a disk-cleanup step is included; even so this may
#      need tuning (a smaller LLVM target list, a larger runner) if it runs out of space or exceeds the job
#      time limit. Manual trigger only (workflow_dispatch) -- deliberately never on every push, since a full
#      LLVM build is multiple hours.
#   2. build-apk-with-toolchain: needs the first job, downloads its output to the exact path
#      app/ide-android/build.gradle.kts reads by default (tools/ndk-toolchain/build/out), and builds
#      `:ide-android:assembleDebug` -- the MAIN app, now with a working on-device C/C++ compiler.
#
# Run it from the Actions tab (Run workflow) once it's in .github/workflows/. Expect the first job to take
# a long time; if it fails on disk space, the LLVM_TARGETS_TO_BUILD / disk-cleanup steps below are the first
# things to adjust. Until this has run once and its output is committed/cached somewhere durable, every
# ordinary apk.yml build stays fully working, just without C/C++ (NdkPlugin reports "no toolchain for this
# device's ABI" instead of failing).
#
# ---

name: NDK Toolchain + APK

on:
  workflow_dispatch:

env:
  JAVA_VERSION: "25"

jobs:
  build-toolchain:
    name: Build on-device LLVM toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build curl

      - name: Run build-llvm-android.sh
        working-directory: tools/ndk-toolchain
        run: |
          chmod +x build-llvm-android.sh
          ./build-llvm-android.sh

      - name: Upload toolchain output
        uses: actions/upload-artifact@v4
        with:
          name: ndk-toolchain-out
          path: tools/ndk-toolchain/build/out
          if-no-files-found: error
          retention-days: 90

  build-apk-with-toolchain:
    name: assembleDebug (:ide-android, with NDK toolchain baked in)
    needs: build-toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download toolchain output
        uses: actions/download-artifact@v4
        with:
          name: ndk-toolchain-out
          path: tools/ndk-toolchain/build/out

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 platforms;android-36.1 build-tools;36.0.0"

      - name: Build debug APK (main app, with C/C++ toolchain)
        run: ./gradlew :ide-android:assembleDebug --console=plain --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codeassist-ndk-debug-apk
          path: app/ide-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
